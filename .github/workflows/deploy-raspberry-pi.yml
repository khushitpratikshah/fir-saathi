name: Deploy FIR Saathi to Raspberry Pi

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fir-saathi-raspberry-pi-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and restart production service
    # The repository-scoped Pi runner has GitHub's built-in Linux and ARM64 labels.
    runs-on: [self-hosted, Linux, ARM64]
    if: github.repository == 'khushitpratikshah/fir-saathi' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    steps:
      - name: Confirm trusted deployment revision
        run: |
          test -n "$GITHUB_SHA"
          printf 'Deploying trusted main revision %s\n' "$GITHUB_SHA"

      - name: Pull, build, and restart FIR Saathi
        run: /srv/fir-saathi/app/bin/deploy-from-main.sh "$GITHUB_SHA"
